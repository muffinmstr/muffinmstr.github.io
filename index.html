<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Board</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#3b6fd4">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ac:#3b6fd4;--ok:#2e8b57;--no:#c0392b;--bd:#e0ded6}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#222220;--tx:#eeede8;--mu:#9a988f;--ac:#6b97ee;--ok:#4cb982;--no:#e8695a;--bd:#38372f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 4px}
nav{display:flex;gap:6px;margin:12px 0}
nav button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
button.b{padding:8px 12px;border:0;border-radius:6px;background:var(--ac);color:#fff;cursor:pointer;font:inherit}
button.y{background:var(--ok)}button.n{background:var(--no)}button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
.acc{color:var(--ok)}.dec{color:var(--no)}.hide{display:none}.dot{color:var(--ok)}
#banner{position:sticky;top:0;background:var(--ok);color:#fff;padding:10px;border-radius:8px;margin:10px 0;display:none;cursor:pointer;z-index:5}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button,input,select{min-height:44px}
input[type=checkbox]{min-height:0;width:24px;height:24px;flex:0 0 auto}
.row>.step{flex:0;min-width:48px;padding:8px 0;text-align:center}
.row>.qty{flex:0;min-width:70px;max-width:90px;text-align:center}
html.big body{font-size:20px}html.big main{max-width:960px;padding:24px}html.big h1{font-size:28px}
html.big .mu{font-size:17px}html.big label{font-size:16px}html.big .tag{font-size:16px}
html.big button,html.big input,html.big select{min-height:60px;font-size:20px;padding:12px 16px}
html.big input[type=checkbox]{width:32px;height:32px;min-height:0;padding:0}
html.big .grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
html.big .card{padding:18px;margin-bottom:16px}html.big nav{gap:12px}
html.big .row>.step{min-width:64px}html.big .row>.qty{min-width:90px}
</style></head><body><main>
<h1 id="title">Trade Board</h1>
<div id="msg" class="card mu">Connecting…</div>
<div id="hint" class="mu hide">🔇 Tap anywhere on the page once to turn on request sounds.</div>
<div id="banner" role="alert"></div>
<div id="app" class="hide">
<nav role="tablist" aria-label="Sections"><button role="tab" aria-selected="true" data-t="find" class="on">Find</button><button role="tab" aria-selected="false" data-t="stash">My stash</button><button role="tab" aria-selected="false" data-t="inbox">Requests <span id="bd"></span></button></nav>
<section id="t-find" role="tabpanel"><div class="card"><div class="grid" id="fsel"></div></div><div id="results"></div></section>
<section id="t-stash" class="hide" role="tabpanel">
 <div class="card">
  <label for="handle">Display name</label><input id="handle" maxlength="30">
  <label for="code">Preferred meeting code</label><input id="code" maxlength="40">
  <label style="display:flex;gap:8px;align-items:center;font-size:15px;color:var(--tx);margin-top:14px"><input type="checkbox" id="avail" style="width:auto"> I'm available to trade right now</label>
  <button class="b" id="save" style="margin-top:10px">Save profile</button> <span id="saved" class="mu" role="status"></span>
 </div>
 <div class="card"><b>Heroes I'll trade</b>
  <div class="grid" id="asel"></div>
  <div class="row" style="margin-top:8px"><div style="max-width:100px"><label for="iqty">Qty</label><input id="iqty" type="number" min="1" value="1"></div><button class="b" id="add" style="flex:0">Add</button></div>
  <div id="items" style="margin-top:10px"></div>
 </div>
 <div class="card"><b>Alerts</b>
  <div class="row" style="margin-top:8px"><button class="b g" id="alerts" type="button">Enable browser alerts</button><button class="b g" id="snd" type="button"></button><button class="b g" id="tsnd" type="button">Test sound</button></div>
  <div class="row" style="margin-top:8px"><button class="b g" id="keep" type="button">Keep running in background: off</button></div>
  <label style="display:flex;gap:10px;align-items:center;font-size:15px;color:var(--tx);margin-top:12px"><input type="checkbox" id="big"> Large buttons &amp; text (good for VR headsets)</label>
  <div class="mu" style="margin-top:6px">A closed tab or locked phone can't receive requests. Keeping this page open (screen on, or in a background tab) lets it chime when a request arrives.</div>
 </div>
</section>
<section id="t-inbox" class="hide" role="tabpanel"><div id="inbox"></div></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(async()=>{
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cfg,D,sb,uid,me={handle:"",code:"",available:true,items:[]},listings=[],reqs=[],online=new Set(),skew=0,seen=new Set();
const now=()=>Date.now()-skew,label=v=>v.join(" · ");
let cleared=new Set();try{cleared=new Set(JSON.parse(localStorage.getItem("tb-cleared")||"[]"))}catch(e){}
const clearIds=ids=>{ids.forEach(i=>cleared.add(i));try{localStorage.setItem("tb-cleared",JSON.stringify([...cleared].slice(-300)))}catch(e){}render()};
const isVR=/OculusBrowser|Quest|Pico|Vive/i.test(navigator.userAgent);let big=isVR;try{const b=localStorage.getItem("tb-big");if(b!==null)big=b==="1"}catch(e){}
document.documentElement.classList.toggle("big",big);
const setBig=on=>{big=on;document.documentElement.classList.toggle("big",on);try{localStorage.setItem("tb-big",on?"1":"0")}catch(e){}};
const setHtml=(el,h)=>{if(el._h===h)return false;el._h=h;el.innerHTML=h;return true};
const err=t=>{const b=$("#banner");b.textContent=t;b.style.background="var(--no)";b.style.display="block";b.onclick=()=>{b.style.display="none"};setTimeout(()=>{if(b.textContent===t)b.style.display="none"},8000)};
const fail=t=>{$("#msg").classList.remove("hide");$("#msg").textContent=t};

try{cfg=await(await fetch("config.json",{cache:"no-store"})).json();D=cfg.dropdowns;if(!Array.isArray(D)||!D.length)throw 0}
catch(e){fail("Couldn't load config.json. Serve this folder over http(s) (GitHub Pages or a local server), not file://.");return}
if(!cfg.supabaseUrl||!cfg.supabaseKey||/YOUR-/.test(cfg.supabaseUrl+cfg.supabaseKey)){fail("Fill in supabaseUrl and supabaseKey in config.json.");return}
document.title=$("#title").textContent=cfg.title||"Trade Board";
sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey);
let session=(await sb.auth.getSession()).data.session;
if(!session){const r=await sb.auth.signInAnonymously();if(r.error){fail("Sign-in failed: "+r.error.message+". In Supabase, enable Authentication → Sign In / Providers → Allow anonymous sign-ins.");return}session=r.data.session}
uid=session.user.id;
try{sb.realtime.setAuth(session.access_token)}catch(e){}
sb.auth.onAuthStateChange((ev,ss)=>{if(ss&&ss.access_token){try{sb.realtime.setAuth(ss.access_token)}catch(e){}}});
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
try{const {data}=await sb.rpc("server_time");if(data)skew=Date.now()-Date.parse(data)}catch(e){}
try{const {data:m}=await sb.from("listings").select("*").eq("user_id",uid).maybeSingle();
 if(m)me={handle:m.handle,code:m.code,available:m.available!==false,items:(m.items||[]).filter(i=>Array.isArray(i.v)&&i.v.length===D.length)}}
catch(e){fail("Database not ready. Did you run setup.sql? "+e.message);return}

$("#msg").classList.add("hide");$("#app").classList.remove("hide");
$("#handle").value=me.handle;$("#code").value=me.code;$("#avail").checked=me.available;
sels("#fsel","f",true);sels("#asel","a",false);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
$("#save").onclick=save;$("#avail").onchange=save;$("#add").onclick=addItem;$("#big").checked=big;$("#big").onchange=e=>setBig(e.target.checked);
$("#alerts").onclick=async()=>{if(typeof Notification==="undefined"){err("Browser alerts aren't available in this browser tab. On iPhone: tap Share → Add to Home Screen, open the app from your Home Screen, then tap this again.");return}try{const r=await Notification.requestPermission();$("#alerts").textContent="Browser alerts: "+(r==="granted"?"on":r)}catch(e){err("Couldn't enable alerts: "+e.message)}};
Promise.resolve().then(()=>{sndLabel();hint();if(keepOn)setKeep(true)});$("#snd").onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("tb-snd",soundOn?"1":"0")}catch(e){}sndLabel();hint()};$("#tsnd").onclick=()=>chime(true);$("#keep").onclick=()=>setKeep(!keepOn);

function tab(t){document.querySelectorAll("nav button").forEach(b=>{b.classList.toggle("on",b.dataset.t===t);b.setAttribute("aria-selected",b.dataset.t===t)});["find","stash","inbox"].forEach(x=>$("#t-"+x).classList.toggle("hide",x!==t))}
function sels(host,p,any){$(host).innerHTML=D.map((d,k)=>`<div><label for="${p}${k}">${esc(d.label)}</label><select id="${p}${k}">${any?'<option value="">Any</option>':""}${(d.options||[]).map(o=>`<option>${esc(o)}</option>`).join("")}</select></div>`).join("");
 if(any)D.forEach((d,k)=>$("#"+p+k).onchange=render)}
let ac,soundOn=true,keepOn=false,wl,ko;
try{soundOn=localStorage.getItem("tb-snd")!=="0";keepOn=localStorage.getItem("tb-keep")==="1"}catch(e){}
const hint=()=>$("#hint").classList.toggle("hide",!soundOn||!!(ac&&ac.state==="running"));
function audio(){
 if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C){ac=new C();ac.onstatechange=hint;try{const s=ac.createBufferSource();s.buffer=ac.createBuffer(1,1,22050);s.connect(ac.destination);s.start(0)}catch(e){}}}
 if(ac&&ac.state!=="running")ac.resume().then(()=>{hint();startKeep()}).catch(()=>{});hint();startKeep();return ac}
["pointerdown","click","keydown","touchend"].forEach(e=>addEventListener(e,audio,{passive:true}));
// A6 1/8, E6 1/8, F#6 1/4, D6 1/8, E6 3/8 (whole-note fractions, no rests), piano-like tone
const MEL=[[1760,.125],[1318.51,.125],[1479.98,.25],[1174.66,.125],[1318.51,.375]];
function piano(a,f,t,dur){const g=a.createGain(),end=t+dur+.4;g.connect(a.destination);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.006);g.gain.exponentialRampToValueAtTime(.0001,end);
 [[1,1],[2,.5],[3,.25],[4,.12],[5,.06]].forEach(([m,amp])=>{const o=a.createOscillator(),og=a.createGain();o.frequency.value=f*m*(1+.0003*m*m);
  og.gain.setValueAtTime(amp,t);og.gain.exponentialRampToValueAtTime(.0001,t+Math.min(end-t,.4+1.2/m));o.connect(og);og.connect(g);o.start(t);o.stop(end+.05)})}
async function chime(force){if(!soundOn&&!force)return;const a=audio();if(!a)return;if(a.state!=="running"){try{await a.resume()}catch(e){}}if(a.state!=="running")return;
 const whole=240/(cfg.soundBpm||120);let t=a.currentTime+.05;
 try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
 for(const[f,d]of MEL){piano(a,f,t,d*whole);t+=d*whole}
 setTimeout(()=>{try{if(navigator.audioSession)navigator.audioSession.type="auto"}catch(e){}},whole*1000+1500)}
const sndLabel=()=>$("#snd").textContent="Sound: "+(soundOn?"on":"off");
function startKeep(){if(keepOn&&ac&&ac.state==="running"&&!ko){const o=ac.createOscillator(),g=ac.createGain();g.gain.value=.00001;o.connect(g);g.connect(ac.destination);o.start();ko=o}}
async function setKeep(on){keepOn=on;try{localStorage.setItem("tb-keep",on?"1":"0")}catch(e){}$("#keep").textContent="Keep running in background: "+(on?"on":"off");
 if(on){audio();startKeep();try{if(navigator.wakeLock&&(!wl||wl.released))wl=await navigator.wakeLock.request("screen")}catch(e){}}
 else{try{ko&&ko.stop()}catch(e){}ko=null;try{wl&&wl.release()}catch(e){}wl=null}}
function notify(t){chime();const b=$("#banner");b.style.background="var(--ok)";b.textContent=t;b.style.display="block";b.onclick=()=>{b.style.display="none";tab("inbox")};
 const o=document.title;document.title="🔔 "+t;setTimeout(()=>document.title=o,8000);
 showNative(t)}
async function showNative(t){try{if(!window.Notification||Notification.permission!=="granted")return;const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)await reg.showNotification("Trade request",{body:t,tag:"trade",renotify:true,icon:"icon-180.png"});else new Notification("Trade request",{body:t})}catch(e){}}

async function save(){me.handle=$("#handle").value.trim()||"Player";me.code=$("#code").value.trim();me.available=$("#avail").checked;
 const {error}=await sb.from("listings").upsert({user_id:uid,handle:me.handle,code:me.code,available:me.available,items:me.items,updated_at:new Date().toISOString()});
 $("#saved").textContent=error?"Error: "+error.message:"Saved ✓";setTimeout(()=>$("#saved").textContent="",3000);return !error}
function addItem(){const v=D.map((d,k)=>$("#a"+k).value),q=Math.max(1,parseInt($("#iqty").value)||1),lb=label(v),ex=me.items.find(i=>i.label===lb);ex?ex.qty+=q:me.items.push({v,qty:q,label:lb});renderItems();save()}
let saveT;const saveSoon=()=>{clearTimeout(saveT);saveT=setTimeout(save,600)};
function setQty(n,q){const it=me.items[n];if(!it)return;it.qty=Math.min(1000,Math.max(1,q||1));$("#items")._h=null;renderItems();saveSoon()}
function renderItems(){const el=$("#items");if(!setHtml(el,me.items.map((i,n)=>{const L=esc(i.label);return `<div class="row" style="padding:6px 0;align-items:center"><span style="min-width:140px">${L}</span><button class="b g step" data-m="${n}" aria-label="Decrease ${L}" type="button">−</button><input class="qty" type="number" min="1" max="1000" inputmode="numeric" value="${i.qty}" data-q="${n}" aria-label="Quantity of ${L}"><button class="b g step" data-p="${n}" aria-label="Increase ${L}" type="button">+</button><button class="b g" style="flex:0" data-r="${n}" aria-label="Remove ${L}" type="button">Remove</button></div>`}).join("")||'<span class="mu">Nothing listed yet.</span>'))return;
 el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{me.items.splice(+b.dataset.r,1);renderItems();save()});
 el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>setQty(+b.dataset.m,me.items[+b.dataset.m].qty-1));
 el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>setQty(+b.dataset.p,me.items[+b.dataset.p].qty+1));
 el.querySelectorAll("[data-q]").forEach(inp=>inp.onchange=()=>setQty(+inp.dataset.q,parseInt(inp.value)))}

async function loadListings(){const {data}=await sb.from("open_listings").select("*");listings=(data||[]).filter(l=>l.user_id!==uid);render()}
async function loadReqs(){const {data}=await sb.from("requests").select("*").gte("created_at",new Date(Date.now()-3600000).toISOString()).order("created_at",{ascending:false});
 if(!data)return;
 data.forEach(r=>{if(!seen.has(r.id)){seen.add(r.id);if(!firstReq&&r.to_user===uid&&r.status==="pending"&&remain(r)>0)notify(`${r.from_name} wants ${r.qty}× ${r.item}`)}});
 firstReq=false;reqs=data;render()}
let firstReq=true;
function syncClock(){sb.rpc("server_time").then(({data})=>{if(data)skew=Date.now()-Date.parse(data)}).catch(()=>{})}
function upsertReq(r){const i=reqs.findIndex(x=>x.id===r.id);i<0?reqs.unshift(r):reqs[i]=r}

async function request(l,i,qty){if(!(qty>=1)||qty>i.qty){err(`Choose 1 to ${i.qty}.`);return}
 if(!me.handle){err("Set your display name in My stash first.");tab("stash");return}
 if(!(await save()))return;
 const {data,error}=await sb.from("requests").insert({to_user:l.user_id,item:i.label,qty}).select().single();
 if(error){err(error.message);return}
 seen.add(data.id);upsertReq(data);tab("inbox");render()}
async function respond(id,status){const {data,error}=await sb.from("requests").update({status}).eq("id",id).select().single();
 if(error){err(error.message);await loadReqs();return}
 upsertReq(data);if(status==="declined"&&data.status==="declined")clearIds([id]);else render()}

const remain=r=>Math.max(0,Math.ceil((Date.parse(r.expires_at)-now())/1000));
function render(){
 const sel=D.map((d,k)=>$("#f"+k).value),hits=[];
 listings.forEach(l=>(l.items||[]).forEach(i=>{if(i.v&&i.label&&sel.every((s,k)=>!s||i.v[k]===s))hits.push({l,i})}));
 hits.sort((a,b)=>online.has(b.l.user_id)-online.has(a.l.user_id));
 const box=$("#results");
 if(setHtml(box,hits.map((h,n)=>`<div class="card"><b>${esc(h.i.label)}</b> <span class="mu">× ${esc(h.i.qty)} available</span><div class="mu">${online.has(h.l.user_id)?'<span class="dot">● online</span> · ':""}${esc(h.l.handle)} · meeting code <b>${esc(h.l.code||"—")}</b></div>
  <div class="row" style="margin-top:8px"><input type="number" min="1" value="1" id="rq${n}" aria-label="Quantity to request" style="max-width:80px;flex:0"><button class="b" data-h="${n}" aria-label="Request ${esc(h.i.label)} from ${esc(h.l.handle)}" style="flex:0;white-space:nowrap">Request trade</button></div></div>`).join("")||'<div class="mu">Nobody is trading that right now.</div>'))
 box.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const h=hits[+b.dataset.h];request(h.l,h.i,parseInt($("#rq"+b.dataset.h).value))});
 const pend=reqs.filter(r=>r.to_user===uid&&r.status==="pending"&&remain(r)>0).length;$("#bd").textContent=pend?`(${pend})`:"";
 const vis=reqs.filter(r=>!cleared.has(r.id)),fin=vis.filter(r=>!(r.status==="pending"&&remain(r)>0));
 if(setHtml($("#inbox"),(fin.length?'<div style="margin-bottom:8px"><button class="b g" id="clrall" type="button">Clear all finished</button></div>':"")+vis.map(r=>{const inbound=r.to_user===uid,live=r.status==="pending"&&remain(r)>0,st=live?"pending":(r.status==="pending"?"declined":r.status);
  const who=inbound?esc(r.from_name)+" → you":"You → "+esc(r.from_user===uid?"them":"you");
  return `<div class="card"><b>${who}</b>: ${esc(r.qty)}× ${esc(r.item)}<div class="mu">Meeting code: <b>${esc(r.to_code||"—")}</b></div>
  <div>${live?`<span class="tag" data-c="${r.id}"></span>`:`<span class="tag ${st==="accepted"?"acc":"dec"}">${st==="accepted"?"Accepted":"Declined"+(r.status==="pending"?" (timed out)":"")}</span>`}</div>
  ${live&&inbound?`<div style="margin-top:8px"><button class="b y" data-a="${r.id}" aria-label="Accept ${esc(r.qty)}× ${esc(r.item)} from ${esc(r.from_name)}">Yes</button> <button class="b n" data-d="${r.id}" aria-label="Decline ${esc(r.qty)}× ${esc(r.item)} from ${esc(r.from_name)}">No</button></div>`:""}${live?"":`<div style="margin-top:8px"><button class="b g" data-x="${r.id}" type="button">Clear</button></div>`}</div>`}).join("")||'<div class="mu">No requests to show.</div>')){
 $("#inbox").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>respond(b.dataset.a,"accepted"));
 $("#inbox").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>respond(b.dataset.d,"declined"));
 $("#inbox").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>clearIds([b.dataset.x]));const ca=$("#clrall");if(ca)ca.onclick=()=>clearIds(fin.map(r=>r.id))}
 renderItems();tick()}
function tick(){document.querySelectorAll("[data-c]").forEach(el=>{const r=reqs.find(x=>x.id===el.dataset.c);if(!r)return;const s=remain(r);
 if(s<=0)return render();el.textContent=`Pending · auto-declines in ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`})}

// live updates: requests (notifications) and who is online
sb.channel("reqs").on("postgres_changes",{event:"*",schema:"public",table:"requests"},p=>{const r=p.new;if(!r||!r.id)return;
 const fresh=!seen.has(r.id);seen.add(r.id);upsertReq(r);
 if(fresh&&r.to_user===uid&&r.status==="pending")notify(`${r.from_name} wants ${r.qty}× ${r.item}`);render()}).subscribe();
const pres=sb.channel("online",{config:{presence:{key:uid}}});
pres.on("presence",{event:"sync"},()=>{online=new Set(Object.keys(pres.presenceState()));render()}).subscribe(s=>{if(s==="SUBSCRIBED")pres.track({t:Date.now()})});

await Promise.all([loadListings(),loadReqs()]);
setInterval(()=>{syncClock();loadListings()},15000);setInterval(loadReqs,5000);setInterval(tick,1000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){syncClock();loadListings();loadReqs();if(keepOn)setKeep(true)}});
})();
</script></main></body></html>
