<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Board</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mu:#6b6a64;--ac:#3b6fd4;--ok:#2e8b57;--no:#c0392b;--bd:#e0ded6}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#222220;--tx:#eeede8;--mu:#9a988f;--ac:#6b97ee;--ok:#4cb982;--no:#e8695a;--bd:#38372f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0 0 4px}
nav{display:flex;gap:6px;margin:12px 0}
nav button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
button.b{padding:8px 12px;border:0;border-radius:6px;background:var(--ac);color:#fff;cursor:pointer;font:inherit}
button.y{background:var(--ok)}button.n{background:var(--no)}button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.mu{color:var(--mu);font-size:13px}.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
.acc{color:var(--ok)}.dec{color:var(--no)}.hide{display:none}
#banner{position:sticky;top:0;background:var(--ok);color:#fff;padding:10px;border-radius:8px;margin:10px 0;display:none;cursor:pointer;z-index:5}
</style></head><body><main>
<h1 id="title">Trade Board</h1>
<div class="mu" id="status">Connecting…</div>
<div id="banner"></div>
<div id="err" class="card hide"></div>
<div id="app" class="hide">
<nav><button data-t="find" class="on">Find</button><button data-t="stash">My stash</button><button data-t="inbox">Requests <span id="bd"></span></button></nav>
<section id="t-find"><div class="card"><div class="grid" id="fsel"></div></div><div id="results"></div></section>
<section id="t-stash" class="hide">
 <div class="card">
  <label>Display name</label><input id="handle" maxlength="30">
  <div class="row"><div><label>Preferred meeting code</label><input id="code" maxlength="40"></div>
  <div><label>Trade limit (max items per trade)</label><input id="limit" type="number" min="1" value="5"></div></div>
  <button class="b" id="save" style="margin-top:10px">Save profile</button> <span id="saved" class="mu"></span>
 </div>
 <div class="card"><b>Items I'll trade</b>
  <div class="grid" id="asel"></div>
  <div class="row" style="margin-top:8px"><div style="max-width:100px"><label>Qty</label><input id="iqty" type="number" min="1" value="1"></div><button class="b" id="add" style="flex:0">Add</button></div>
  <div id="items" style="margin-top:10px"></div>
 </div>
 <button class="b g" id="alerts">Enable browser alerts</button>
</section>
<section id="t-inbox" class="hide"><div id="inbox"></div></section>
</div>

<script type="module">
// Trystero finds peers through public WebTorrent trackers, then connects browsers directly (WebRTC). No server of yours.
import {joinRoom, selfId} from 'https://esm.run/trystero@0.21/torrent';

const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TTL=300000, GRACE=10000;
let cfg,D,room,sendListing,sendReq,sendRes,me,peers={},inc=[],out=[];
const rid=()=>Math.random().toString(36).slice(2,10);

async function boot(){
 try{cfg=await(await fetch('config.json',{cache:'no-store'})).json();D=cfg.dropdowns;if(!Array.isArray(D)||!D.length)throw 0}
 catch(e){const el=$("#err");el.classList.remove("hide");el.textContent="Couldn't load config.json. Serve this folder over http(s) (GitHub Pages or a local server), not file://.";$("#status").textContent="";return}
 document.title=$("#title").textContent=cfg.title||"Trade Board";
 try{me=JSON.parse(localStorage.getItem("tb-me"))}catch(e){}
 me=Object.assign({handle:"",code:"",limit:5,items:[]},me||{});me.items=(me.items||[]).filter(i=>Array.isArray(i.v)&&i.v.length===D.length);
 $("#handle").value=me.handle;$("#code").value=me.code;$("#limit").value=me.limit;
 sels("#fsel","f",true);sels("#asel","a",false);
 $("#app").classList.remove("hide");
 document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.t));
 $("#save").onclick=()=>{persist();$("#saved").textContent="Saved ✓";setTimeout(()=>$("#saved").textContent="",2000)};
 $("#add").onclick=addItem;
 $("#alerts").onclick=()=>{try{Notification.requestPermission()}catch(e){}};
 try{
  room=joinRoom({appId:cfg.appId},cfg.room||"main");
  let ga,gq,gs;[sendListing,ga]=room.makeAction("listing");[sendReq,gq]=room.makeAction("req");[sendRes,gs]=room.makeAction("res");
  room.onPeerJoin(id=>{sendListing(pub(),id);status()});
  room.onPeerLeave(id=>{delete peers[id];out.forEach(o=>{if(o.peer===id&&o.status==="pending")o.status="declined"});status();render()});
  ga((d,id)=>{peers[id]=clean(d);status();render()});
  gq(onReq);gs(onRes);
 }catch(e){$("#status").textContent="Couldn't start peer connection: "+e.message}
 status();render();setInterval(tick,1000);
}
function status(){const n=Object.keys(peers).length;$("#status").textContent=`Online: you + ${n} other${n===1?"":"s"} in room "${cfg.room||"main"}"`}
function tab(t){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));["find","stash","inbox"].forEach(x=>$("#t-"+x).classList.toggle("hide",x!==t))}
function sels(host,p,any){$(host).innerHTML=D.map((d,k)=>`<div><label>${esc(d.label)}</label><select id="${p}${k}">${any?'<option value="">Any</option>':""}${(d.options||[]).map(o=>`<option>${esc(o)}</option>`).join("")}</select></div>`).join("");
 if(any)D.forEach((d,k)=>$("#"+p+k).onchange=render)}
const label=v=>v.join(" · ");
function pub(){return{handle:me.handle||"Player",code:me.code,limit:me.limit,items:me.items}}
function persist(){me.handle=$("#handle").value.trim()||"Player";me.code=$("#code").value.trim();me.limit=Math.max(1,+$("#limit").value||1);
 try{localStorage.setItem("tb-me",JSON.stringify(me))}catch(e){}
 try{sendListing&&sendListing(pub())}catch(e){}}
function addItem(){const v=D.map((d,k)=>$("#a"+k).value),q=Math.max(1,+$("#iqty").value||1);const ex=me.items.find(i=>label(i.v)===label(v));ex?ex.qty+=q:me.items.push({v,qty:q});persist();renderItems()}
function renderItems(){const el=$("#items");el.innerHTML=me.items.map((i,n)=>`<div class="row" style="padding:4px 0;align-items:center"><span>${esc(label(i.v))} <span class="mu">× ${i.qty}</span></span><button class="b g" style="flex:0" data-r="${n}">Remove</button></div>`).join("")||'<span class="mu">Nothing listed yet.</span>';
 el.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{me.items.splice(+b.dataset.r,1);persist();renderItems()})}
function clean(d){d=d||{};const s=(x,n)=>String(x??"").slice(0,n);return{handle:s(d.handle||"Player",30),code:s(d.code,40),limit:Math.max(1,+d.limit||1),
 items:(Array.isArray(d.items)?d.items:[]).slice(0,200).map(i=>({v:(Array.isArray(i&&i.v)?i.v:[]).slice(0,D.length).map(x=>s(x,60)),qty:Math.max(0,Math.floor(+(i&&i.qty)||0))})).filter(i=>i.v.length===D.length&&i.qty>0)}}
function notify(t){const b=$("#banner");b.textContent=t;b.style.display="block";b.onclick=()=>{b.style.display="none";tab("inbox")};
 const o=document.title;document.title="🔔 "+t;setTimeout(()=>document.title=o,8000);
 try{if(window.Notification&&Notification.permission==="granted")new Notification("Trade request",{body:t})}catch(e){}}

// --- trading ---
function request(id,i,qty){const p=peers[id];if(!p)return;const lim=Math.min(p.limit,i.qty);if(!(qty>=1)||qty>lim){alert(`Choose 1 to ${lim}.`);return}
 if(!me.handle){alert("Set your display name in My stash first.");tab("stash");return}
 const r={rid:rid(),peer:id,name:p.handle,v:i.v,qty,code:p.code,status:"pending",exp:Date.now()+TTL+GRACE};out.push(r);
 sendReq({rid:r.rid,v:i.v,qty,name:me.handle,code:me.code},id);tab("inbox");render()}
function onReq(d,id){d=d||{};const v=(Array.isArray(d.v)?d.v:[]).map(x=>String(x).slice(0,60)),qty=Math.floor(+d.qty||0),r={rid:String(d.rid||"").slice(0,20),peer:id,name:String(d.name||"Player").slice(0,30),v,qty,code:String(d.code||"").slice(0,40),status:"pending",exp:Date.now()+TTL};
 const have=me.items.find(i=>label(i.v)===label(v));
 if(!r.rid||!have||qty<1||qty>Math.min(have.qty,me.limit)){sendRes({rid:r.rid,status:"declined"},id);return}
 inc.push(r);notify(`${r.name} wants ${qty}× ${label(v)}`);render()}
function respond(rid_,status){const r=inc.find(x=>x.rid===rid_);if(!r||r.status!=="pending"||Date.now()>=r.exp)return render();r.status=status;sendRes({rid:rid_,status,code:me.code},r.peer);render()}
function onRes(d,id){const r=out.find(x=>x.rid===(d&&d.rid)&&x.peer===id);if(!r||r.status!=="pending"||Date.now()>=r.exp)return;
 r.status=d.status==="accepted"?"accepted":"declined";if(r.status==="accepted"&&d.code)r.code=String(d.code).slice(0,40);render()}
function tick(){const now=Date.now();let ch=false;[...inc,...out].forEach(r=>{if(r.status==="pending"&&now>=r.exp){r.status="declined";r.timedOut=true;ch=true}});
 if(ch)render();else document.querySelectorAll("[data-c]").forEach(el=>{const r=[...inc,...out].find(x=>x.rid===el.dataset.c);if(!r)return;const s=Math.max(0,Math.ceil((Math.min(r.exp,r.exp)-now)/1000));el.textContent=`Pending · auto-declines in ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`})}

function render(){
 if(!D)return;const sel=D.map((d,k)=>$("#f"+k).value),box=$("#results"),hits=[];
 Object.entries(peers).forEach(([id,p])=>p.items.forEach(i=>{if(sel.every((s,k)=>!s||i.v[k]===s))hits.push({id,p,i})}));
 box.innerHTML=hits.map((h,n)=>`<div class="card"><b>${esc(label(h.i.v))}</b> <span class="mu">× ${h.i.qty} available</span><div class="mu">${esc(h.p.handle)} · meeting code <b>${esc(h.p.code||"—")}</b> · max ${h.p.limit} per trade</div>
  <div class="row" style="margin-top:8px"><input type="number" min="1" value="1" id="rq${n}" style="max-width:80px;flex:0"><button class="b" data-h="${n}" style="flex:0;white-space:nowrap">Request trade</button></div></div>`).join("")||`<div class="mu">${Object.keys(peers).length?"Nobody online is trading that.":"No other players online right now."}</div>`;
 box.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const h=hits[+b.dataset.h];request(h.id,h.i,+$("#rq"+b.dataset.h).value)});
 const now=Date.now(),pend=inc.filter(r=>r.status==="pending"&&now<r.exp).length;$("#bd").textContent=pend?`(${pend})`:"";
 const all=[...inc.map(r=>({...r,in:true})),...out].sort((a,b)=>b.exp-a.exp);
 $("#inbox").innerHTML=all.map(r=>{const live=r.status==="pending";
  return `<div class="card"><b>${r.in?esc(r.name)+" → you":"You → "+esc(r.name)}</b>: ${r.qty}× ${esc(label(r.v))}<div class="mu">Meeting code: <b>${esc(r.code||"—")}</b></div>
  <div>${live?`<span class="tag" data-c="${r.rid}"></span>`:`<span class="tag ${r.status==="accepted"?"acc":"dec"}">${r.status==="accepted"?"Accepted":"Declined"+(r.timedOut?" (timed out)":"")}</span>`}</div>
  ${live&&r.in?`<div style="margin-top:8px"><button class="b y" data-a="${r.rid}">Yes</button> <button class="b n" data-d="${r.rid}">No</button></div>`:""}</div>`}).join("")||'<div class="mu">No requests this session.</div>';
 $("#inbox").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>respond(b.dataset.a,"accepted"));
 $("#inbox").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>respond(b.dataset.d,"declined"));
 renderItems();tick()}
boot();
</script></main></body></html>
